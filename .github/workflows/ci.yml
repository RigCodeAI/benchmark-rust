name: benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --quiet --locked -- verify
      - run: ./scoreBenchmark.sh --results results/examples/example-sast.sarif --output-dir /tmp/example-scorecard
      - run: bash -n runBenchmark.sh scoreBenchmark.sh verifyBenchmark.sh
      - run: jq empty schemas/*.json cases/catalog.json

  language-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo +1.97.1 test --locked --manifest-path corpus/language/Cargo.toml

  product-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libxml2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo +1.97.1 check --locked --manifest-path apps/axum-product/Cargo.toml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
