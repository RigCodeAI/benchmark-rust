name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libxml2-dev pkg-config
      - run: ./verifyBenchmark.sh
      - run: cargo build --release --locked
      - name: Build release artifacts
        run: |
          name="BenchmarkRust-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="${name}/" "$GITHUB_SHA" | gzip -n > "${name}.tar.gz"
          cp target/release/benchmark-rust "benchmark-rust-${GITHUB_REF_NAME}-linux-x86_64"
          sha256sum "${name}.tar.gz" "benchmark-rust-${GITHUB_REF_NAME}-linux-x86_64" > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            BenchmarkRust-${{ github.ref_name }}.tar.gz
            benchmark-rust-${{ github.ref_name }}-linux-x86_64
            SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "BenchmarkRust-${GITHUB_REF_NAME}.tar.gz"
          "benchmark-rust-${GITHUB_REF_NAME}-linux-x86_64"
          SHA256SUMS
          --verify-tag --generate-notes
