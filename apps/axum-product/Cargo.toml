[package]
name = "sivere-benchmark-rust-axum"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[features]
default = ["compiler-shapes"]
compiler-shapes = []

[dependencies]
axum = { version = "=0.8.9", features = ["form", "json", "multipart", "query", "tokio"] }
axum-extra = { version = "=0.12.6", default-features = false, features = ["cookie"] }
fancy-regex = "=0.19.0"
fastrand = "=2.3.0"
html-escape = "=0.2.13"
ldap3 = { version = "=0.11.5", default-features = false }
libxml = "=0.3.21"
maud = "=0.27.0"
md5 = "=0.8.1"
minijinja = "=2.13.0"
rand = "=0.9.2"
redis = { version = "=0.32.7", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
rhai = "=1.25.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.108"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
sxd-document = "=0.3.2"
sxd-xpath = "=0.4.2"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
